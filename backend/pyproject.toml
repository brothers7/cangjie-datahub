[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[project]
name = "data-agent-backend"
version = "1.0.0"
description = "企业数据仓库问答分析智能体 - 后端"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "aiosqlite>=0.20",
    "greenlet>=3.0",
    "httpx>=0.27",
    "sqlglot>=25.0",
    "pandas>=2.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.8",
    "cryptography>=42.0",
    "apscheduler>=3.10",
    "qdrant-client>=1.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# 真实数仓接入驱动（按需安装）
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
clickhouse = ["clickhouse-connect>=0.7", "clickhouse-sqlalchemy>=0.3"]
# 注：不用 PyHive[hive] extra——其 sasl 依赖在 Python 3.12 无法编译（longintrepr.h 已移除）；
# 无 Kerberos/LDAP 认证的 HiveServer2 仅需 PyHive + thrift。启用 SASL 认证的集群需另行处理。
hive = ["PyHive>=0.7", "thrift>=0.16"]
spark = ["PyHive>=0.7", "thrift>=0.16"]
doris = ["pymysql>=1.1"]
starrocks = ["pymysql>=1.1"]
all-db = [
    "pymysql>=1.1", "psycopg[binary]>=3.1",
    "clickhouse-connect>=0.7", "clickhouse-sqlalchemy>=0.3", "PyHive>=0.7", "thrift>=0.16",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
dev-dependencies = ["pytest>=8.0", "pytest-asyncio>=0.23"]
