# Alembic 配置（异步环境）。迁移入口：
#   cd backend && alembic -c alembic/alembic.ini upgrade head
#
# 老部署平滑接入：数据库已由旧版 create_all / bootstrap 建过表，
# 首次接入直接 `alembic -c alembic/alembic.ini stamp head` 标记到基线即可，
# 之后再 upgrade 只应用增量 revision。
[alembic]
script_location = %(here)s
prepend_sys_path = .
path_separator = os
# 数据库 URL 默认走应用配置（app.core.config.settings.app_db_url，即 APP_DB_URL 环境变量），
# 也可在此处显式覆盖（如离线生成 SQL）：sqlalchemy.url = driver://user:pass@host/db

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
